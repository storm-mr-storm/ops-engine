version: "3.9"

services:
  app:
    build: .
    container_name: ops_engine_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7
    container_name: ops_engine_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: ops_engine_postgres
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: opspassword
      POSTGRES_DB: ops_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
